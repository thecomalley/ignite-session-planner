<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ignite Session Planner</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #131d33;
        --panel-2: #192745;
        --accent: #7cc7ff;
        --accent-2: #8ef0c0;
        --text: #edf3ff;
        --muted: #b8c6df;
        --border: rgba(255,255,255,0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #142749 0%, #0b1020 45%, #070b13 100%);
        color: var(--text);
      }
      .page {
        width: 100%;
        margin: 0;
        padding: 32px 16px 60px;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 3rem);
      }
      .controls {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }
      input,
      .controls select {
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--text);
        padding: 10px 16px;
        min-width: 280px;
        font: inherit;
      }
      .controls select {
        color-scheme: dark;
        cursor: pointer;
      }
      .multi-select-filter {
        position: relative;
        min-width: 280px;
        z-index: 10;
      }
      .multi-select-filter > summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        list-style: none;
        min-width: 280px;
        padding: 10px 16px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(255,255,255,0.04);
        color: var(--text);
        cursor: pointer;
        font: inherit;
      }
      .multi-select-filter > summary::-webkit-details-marker {
        display: none;
      }
      .multi-select-filter > summary::after {
        content: "⌄";
        color: var(--muted);
      }
      .multi-select-options {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        max-height: 280px;
        overflow-y: auto;
        padding: 6px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: #101a2d;
        box-shadow: 0 12px 28px rgba(0,0,0,0.4);
      }
      .multi-select-option {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 10px;
        border-radius: 8px;
        color: var(--text);
        cursor: pointer;
      }
      .multi-select-option:hover {
        background: rgba(255,255,255,0.07);
      }
      .session-type-swatch {
        flex: 0 0 auto;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--session-type-color);
      }
      .multi-select-option input {
        width: 16px;
        height: 16px;
        min-width: 16px;
        margin: 0;
        padding: 0;
        accent-color: var(--accent-2);
      }
      .view-toggle {
        display: inline-flex;
        padding: 4px;
        border-radius: 999px;
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--border);
        gap: 4px;
      }
      .view-toggle button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        padding: 8px 12px;
        font: inherit;
        cursor: pointer;
      }
      .view-toggle button.active {
        background: rgba(124, 199, 255, 0.18);
        color: var(--text);
        box-shadow: inset 0 0 0 1px rgba(124, 199, 255, 0.22);
      }
      .location-toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--border);
        color: var(--muted);
        font: inherit;
      }
      .location-toggle input {
        min-width: 0;
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
      }
      .summary {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 20px;
      }
      .date-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 0 0 18px;
        padding: 10px 12px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
      }
      .date-nav button,
      .date-nav select {
        appearance: none;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(255,255,255,0.03);
        color: var(--text);
        font: inherit;
        padding: 8px 12px;
      }
      .date-nav button {
        cursor: pointer;
      }
      .date-nav select {
        min-width: 210px;
        text-align: center;
      }
      .service-note {
        margin-bottom: 18px;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(255, 178, 72, 0.12);
        border: 1px solid rgba(255, 178, 72, 0.35);
        color: var(--muted);
        display: none;
      }
      .session-warning {
        margin-bottom: 18px;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(255, 178, 72, 0.12);
        border: 1px solid rgba(255, 178, 72, 0.35);
        color: var(--text);
      }
      .session-warning[hidden] {
        display: none;
      }
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 18px;
      }
      .tab {
        appearance: none;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
        color: var(--muted);
        padding: 9px 14px;
        border-radius: 999px;
        cursor: pointer;
        font: inherit;
      }
      .tab.active {
        background: rgba(124, 199, 255, 0.12);
        color: var(--text);
        border-color: rgba(124, 199, 255, 0.4);
      }
      .pill {
        background: rgba(124, 199, 255, 0.12);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 8px 12px;
        color: var(--muted);
      }
      .agenda {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
      }
      .planner-layout {
        display: block;
        min-width: 0;
      }
      .planner-main {
        min-width: 0;
      }
      .planner-side {
        display: none;
      }
      .calendar-shell {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow-x: auto;
        overflow-y: hidden;
        background: rgba(19, 29, 51, 0.5);
      }
      .calendar-shell.single-day {
        min-width: 760px;
      }
      .calendar-header.single-day,
      .calendar-body.single-day {
        width: max-content;
        min-width: 760px;
      }
      .calendar-header,
      .calendar-body {
        display: grid;
        grid-template-columns: 86px repeat(var(--day-count), minmax(220px, 1fr));
      }
      .calendar-header.single-day,
      .calendar-body.single-day {
        grid-template-columns: 86px 1fr;
      }
      .calendar-header {
        background: rgba(255,255,255,0.03);
        border-bottom: 1px solid var(--border);
      }
      .calendar-body {
        min-height: calc(var(--row-count) * 54px);
      }
      .corner,
      .day-header,
      .time-label {
        border-right: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
      }
      .corner {
        min-height: 54px;
        background: rgba(255,255,255,0.02);
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        justify-content: flex-end;
        padding: 0 8px 6px 0;
      }
      .day-header {
        padding: 12px;
        text-align: left;
        font-weight: 700;
        color: var(--muted);
      }
      .day-header strong {
        display: block;
        font-size: 1.05rem;
        color: var(--text);
      }
      .time-gutter {
        display: grid;
        grid-template-rows: repeat(var(--row-count), 54px);
        background: rgba(255,255,255,0.01);
      }
      .time-label {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 5px 2px;
        font-size: 0.72rem;
        text-align: center;
        color: var(--muted);
      }
      .time-label-time {
        color: var(--text);
        font-weight: 600;
        white-space: nowrap;
      }
      .time-session-count {
        font-size: 0.64rem;
        line-height: 1.15;
        white-space: nowrap;
      }
      .time-label.has-selected-session {
        background: rgba(142, 240, 192, 0.1);
      }
      .time-label.has-selected-session .time-label-time,
      .time-selected-indicator {
        color: var(--accent-2);
      }
      .time-selected-indicator {
        font-size: 0.6rem;
        font-weight: 700;
        line-height: 1.1;
        white-space: nowrap;
      }
      .day-column {
        position: relative;
        min-height: calc(var(--row-count) * 54px);
        background:
          repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.04) 0,
            rgba(255,255,255,0.04) 1px,
            transparent 1px,
            transparent 54px
          );
        border-right: 1px solid var(--border);
      }
      .event-block {
        position: absolute;
        border-radius: 12px;
        padding: 8px 10px;
        background: rgba(19, 29, 51, 0.18);
        border: 1px solid rgba(124, 199, 255, 0.7);
        box-shadow: inset 0 0 0 1px rgba(124, 199, 255, 0.18);
        overflow: hidden;
        min-width: 180px;
        max-width: 320px;
      }
      .event-block::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 4px;
        background: var(--session-type-color, #7cc7ff);
        pointer-events: none;
      }
      .event-block h4 {
        margin: 0 0 6px;
        font-size: 0.82rem;
        line-height: 1.25;
      }
      .event-block a {
        color: var(--text);
        text-decoration: none;
      }
      .event-block a:hover {
        text-decoration: underline;
      }
      .event-block .event-meta {
        color: var(--muted);
        font-size: 0.72rem;
        line-height: 1.45;
      }
      .event-block {
        min-width: 0;
        max-width: none;
        padding: 4px 7px;
        transition: opacity 0.12s ease;
      }
      .event-block h4 {
        margin: 2px 0 3px;
        font-size: 0.78rem;
        line-height: 1.2;
        display: -webkit-box;
        -webkit-line-clamp: var(--title-lines, 2);
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .event-block .event-meta {
        font-size: 0.66rem;
        line-height: 1.25;
      }
      .event-top {
        font-size: 0.64rem;
      }
      .event-block.has-conflict {
        box-shadow: inset 0 0 0 1px rgba(255, 179, 71, 0.28);
      }
      .event-block.is-clash {
        box-shadow: inset 0 0 0 2px #ffb347, 0 4px 16px rgba(0, 0, 0, 0.35);
        z-index: 4;
      }
      .event-block.is-active {
        outline: 2px solid #ffffff;
        outline-offset: 1px;
        z-index: 5;
      }
      .event-block.is-dimmed {
        opacity: 0.22;
      }
      .event-block.is-selected {
        border-color: var(--accent-2);
        box-shadow: inset 0 0 0 1px rgba(142, 240, 192, 0.38);
      }
      .event-select-button {
        position: absolute;
        top: 4px;
        right: 5px;
        z-index: 6;
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: rgba(7, 11, 19, 0.82);
        color: var(--text);
        font: inherit;
        font-size: 0.8rem;
        line-height: 1;
        cursor: pointer;
      }
      .event-select-button[aria-pressed="true"] {
        background: rgba(142, 240, 192, 0.2);
        border-color: var(--accent-2);
        color: var(--accent-2);
      }
      .event-select-button:focus-visible,
      .selection-filter:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .selection-filter {
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(255,255,255,0.04);
        color: var(--text);
        padding: 10px 14px;
        font: inherit;
        cursor: pointer;
        white-space: nowrap;
      }
      .selection-filter.active {
        border-color: rgba(142, 240, 192, 0.5);
        background: rgba(142, 240, 192, 0.12);
      }
      .event-top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 6px;
        font-size: 0.68rem;
        color: var(--muted);
        line-height: 1.2;
      }
      .event-time {
        color: var(--text);
        font-weight: 700;
        white-space: nowrap;
      }
      .event-duration {
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .event-block .event-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .event-type {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--session-type-color, #7cc7ff);
        font-weight: 600;
      }
      .event-type-dot {
        display: inline-block;
        flex: 0 0 auto;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--session-type-color, #7cc7ff);
      }
      .event-session-code {
        color: var(--accent);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .event-recording {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        color: var(--accent-2);
      }
      .event-recording.not-recorded {
        color: var(--muted);
      }
      .event-recording svg {
        display: block;
        width: 14px;
        height: 14px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.6;
      }
      .event-block.compact {
        padding: 3px 6px;
      }
      .event-block.compact .event-top {
        font-size: 0.6rem;
      }
      .event-block.compact h4 {
        margin: 0;
        font-size: 0.69rem;
        line-height: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        -webkit-line-clamp: 1;
      }
      .event-block.compact .event-meta {
        display: flex;
        padding-right: 22px;
        font-size: 0.57rem;
        line-height: 1;
      }
      .event-block.compact .event-type-name {
        display: none;
      }
      .event-block.compact .event-recording svg {
        width: 11px;
        height: 11px;
      }
      .building-count {
        display: block;
        margin-top: 2px;
        font-size: 0.7rem;
        font-weight: 400;
        color: var(--muted);
      }
      .corner-label {
        font-size: 0.7rem;
        color: var(--muted);
      }
      .empty {
        margin-top: 20px;
        padding: 20px;
        border-radius: 12px;
        background: rgba(255,255,255,0.02);
        border: 1px dashed var(--border);
        color: var(--muted);
      }
      @media (max-width: 820px) {
        .calendar-shell {
          overflow-x: auto;
        }
        .calendar-header,
        .calendar-body {
          min-width: 680px;
        }
        .planner-layout {
          grid-template-columns: 1fr;
        }
      }
      /* Keep planning controls compact and let the calendar take the space. */
      .page { padding: 16px 16px 24px; }
      .topbar {
        gap: 8px;
        margin-bottom: 10px;
        flex-wrap: nowrap;
        justify-content: flex-start;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .topbar::-webkit-scrollbar { display: none; }
      .brand { flex: 0 0 auto; }
      h1 { font-size: 1.1rem; white-space: nowrap; }
      .date-nav { flex: 0 0 auto; }
      .date-nav {
        justify-content: flex-start;
        gap: 4px;
        margin: 0;
        padding: 3px;
        background: rgba(255,255,255,0.03);
      }
      .date-nav button, .date-nav select {
        border: 0;
        border-radius: 8px;
        padding: 7px 10px;
      }
      .date-nav button:disabled { opacity: 0.35; cursor: default; }
      .date-nav select { min-width: 0; color-scheme: dark; }
      .controls { gap: 8px; margin: 0; flex: 1 0 auto; flex-wrap: nowrap; }
      .controls input[type="search"] {
        flex: 1 0 160px;
        width: 160px;
        min-width: 160px;
        border-radius: 10px;
        padding: 9px 12px;
      }
      .selection-filter, .filter-panel > summary, .clear-filters {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(255,255,255,0.04);
        color: var(--text);
        padding: 9px 12px;
        font: inherit;
        cursor: pointer;
        white-space: nowrap;
      }
      .filter-panel { position: relative; z-index: 11; }
      .filter-panel > summary { list-style: none; }
      .filter-panel > summary::-webkit-details-marker { display: none; }
      .filter-panel > summary::after { content: " ⌄"; color: var(--muted); }
      .filter-panel[open] > summary, .filter-panel.has-filters > summary {
        border-color: rgba(124, 199, 255, 0.5);
        background: rgba(124, 199, 255, 0.1);
      }
      .filter-panel-content {
        position: fixed;
        top: 0;
        left: 0;
        width: min(360px, calc(100vw - 32px));
        display: grid;
        gap: 12px;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: #101a2d;
        box-shadow: 0 12px 28px rgba(0,0,0,0.4);
      }
      .filter-field { display: grid; gap: 5px; color: var(--muted); font-size: 0.8rem; }
      .controls .filter-field select, .filter-field .multi-select-filter,
      .filter-field .multi-select-filter > summary {
        width: 100%;
        min-width: 0;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 0.9rem;
      }
      .filter-field .multi-select-filter { padding: 0; }
      .clear-filters { color: var(--muted); }
      .clear-filters[hidden], .short-label { display: none; }
      .service-note, .session-warning { margin-bottom: 12px; }
      @media (max-width: 680px) {
        .page { padding: 12px 10px 24px; }
        .topbar, .controls { gap: 4px; }
        .title-detail, .long-label { display: none; }
        .short-label { display: inline; }
        .date-nav button, .date-nav select { padding-left: 5px; padding-right: 5px; }
        .selection-filter, .filter-panel > summary, .clear-filters { padding-left: 8px; padding-right: 8px; }
        .controls input[type="search"] { flex-basis: 100px; width: 100px; min-width: 100px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <div class="brand">
          <h1>Ignite<span class="title-detail"> session planner</span></h1>
        </div>
        <div class="date-nav" aria-label="Day selector">
          <button id="prev-day" type="button" aria-label="Previous day">←</button>
          <select id="date-selector" aria-label="Select a day"></select>
          <button id="next-day" type="button" aria-label="Next day">→</button>
        </div>
        <div class="controls">
        <input id="search" type="search" aria-label="Search sessions" placeholder="Search title, topic, speaker, or room" />
        <button id="selection-filter" class="selection-filter" type="button" aria-pressed="false" aria-label="My sessions (0)"><span class="long-label">My sessions</span><span class="short-label" aria-hidden="true">My</span> <span id="selection-count">(0)</span></button>
        <details id="filter-panel" class="filter-panel">
          <summary id="filter-panel-label">Filters</summary>
          <div class="filter-panel-content">
            <div class="filter-field">
              <span>Session type</span>
              <details id="session-type-filter" class="multi-select-filter">
                <summary id="session-type-filter-label">All session types</summary>
                <div id="session-type-filter-options" class="multi-select-options" role="group" aria-label="Filter by session type"></div>
              </details>
            </div>
            <label class="filter-field" for="session-level-filter">Level
              <select id="session-level-filter"><option value="">All levels</option></select>
            </label>
            <label class="filter-field" for="recording-status-filter">Recording
              <select id="recording-status-filter"><option value="">All recording statuses</option></select>
            </label>
            <label class="filter-field" for="audience-type-filter">Audience
              <select id="audience-type-filter"><option value="">All audience types</option></select>
            </label>
            <label class="filter-field" for="sort-by">Group by
              <select id="sort-by">
                <option value="location">Location</option>
                <option value="sessionType">Session type</option>
              </select>
            </label>
          </div>
        </details>
        <button id="clear-filters" class="clear-filters" type="button" aria-label="Clear filters" hidden><span class="long-label">Clear filters</span><span class="short-label" aria-hidden="true">✕</span></button>
        </div>
      </div>

      <div id="session-code-warning" class="session-warning" role="status" hidden></div>
      <div class="service-note" id="service-note">
        Open this page from a local server such as http://localhost:8000/ignite_planner.html so the planner can load sessions.json.
      </div>

      <div id="agenda" class="agenda" aria-live="polite"></div>
    </div>

    <script>
      const SELECTED_SESSIONS_KEY = "ignite-planner-selected-sessions";
      const SELECTED_DATE_KEY = "ignite-planner-selected-date";
      const state = {
        sessions: [],
        filtered: [],
        selectedDate: loadSelectedDate(),
        selectedSessions: loadSelectedSessions(),
        showSelectedOnly: false,
        sortBy: "location"
      };
      const EVENT_TIMEZONE = "America/Los_Angeles";
      const SESSION_TYPE_COLORS = Object.freeze({
        "Breakout": "#6cc5ff",
        "Broadcast Stage": "#c084fc",
        "Digital Lab": "#22d3ee",
        "Innovation Session": "#fbbf24",
        "Keynote": "#fb7185",
        "Lab": "#cbd5e1",
        "Lightning Talk": "#f472b6",
        "Pre-recorded": "#a3e635",
        "Table Talk": "#fb923c",
        "Theater": "#818cf8"
      });

      function getSessionTypeColor(sessionType) {
        return Object.hasOwn(SESSION_TYPE_COLORS, sessionType) ? SESSION_TYPE_COLORS[sessionType] : "#7cc7ff";
      }
      const eventPartsFormatter = new Intl.DateTimeFormat("en-CA", {
        timeZone: EVENT_TIMEZONE,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });
      const clockFormatter = new Intl.DateTimeFormat("en-US", {
        timeZone: EVENT_TIMEZONE,
        hour: "numeric",
        minute: "2-digit"
      });
      const timeLabelFormatter = new Intl.DateTimeFormat("en-US", {
        hour: "numeric",
        minute: "2-digit",
        timeZone: "UTC"
      });
      const eventPartsCache = new Map();
      const clockCache = new Map();
      const searchCache = new WeakMap();

      function loadSelectedSessions() {
        try {
          const saved = JSON.parse(localStorage.getItem(SELECTED_SESSIONS_KEY) || "[]");
          return new Set(Array.isArray(saved) ? saved.map(String) : []);
        } catch {
          return new Set();
        }
      }

      function loadSelectedDate() {
        try {
          return localStorage.getItem(SELECTED_DATE_KEY);
        } catch {
          return null;
        }
      }

      function saveSelectedDate() {
        try {
          if (state.selectedDate) {
            localStorage.setItem(SELECTED_DATE_KEY, state.selectedDate);
          } else {
            localStorage.removeItem(SELECTED_DATE_KEY);
          }
        } catch (error) {
          console.warn("Unable to save the selected date in this browser.", error);
        }
      }

      function saveSelectedSessions() {
        try {
          localStorage.setItem(SELECTED_SESSIONS_KEY, JSON.stringify([...state.selectedSessions]));
        } catch (error) {
          console.warn("Unable to save selected sessions in this browser.", error);
        }
      }

      function getSessionKey(session) {
        const identity = session.sessionCode || session.id || session.title;
        return `${identity}|${session.start || ""}|${session.end || ""}`;
      }

      function updateSelectionFilter() {
        const button = document.getElementById("selection-filter");
        document.getElementById("selection-count").textContent = `(${state.selectedSessions.size})`;
        button.setAttribute("aria-label", `My sessions (${state.selectedSessions.size})`);
        button.classList.toggle("active", state.showSelectedOnly);
        button.setAttribute("aria-pressed", String(state.showSelectedOnly));
      }

      function updateSessionCodeWarning() {
        const warning = document.getElementById("session-code-warning");
        const selectedByCode = new Map();
        for (const session of state.sessions) {
          const code = (session.sessionCode || "").trim();
          if (!code || !state.selectedSessions.has(getSessionKey(session))) continue;
          const normalizedCode = code.toUpperCase();
          if (!selectedByCode.has(normalizedCode)) {
            selectedByCode.set(normalizedCode, { code, occurrences: new Set(), count: 0 });
          }
          const selected = selectedByCode.get(normalizedCode);
          selected.count += 1;
          const date = session.start ? getEventDateKey(session.start) : "";
          if (date) selected.occurrences.add(`${date}|${session.start}`);
        }

        const duplicates = [...selectedByCode.values()].filter(({ count }) => count > 1);
        if (!duplicates.length) {
          warning.hidden = true;
          warning.textContent = "";
          return;
        }

        const duplicateCodes = duplicates.map(({ code, occurrences }) => {
          const schedule = [...occurrences].sort().map((occurrence) => {
            const [date, start] = occurrence.split("|");
            return `${formatDayKey(date)} ${formatClock(start)}`;
          });
          return `${code} (${schedule.join(", ")})`;
        });
        warning.textContent = `Repeated session codes in My sessions: ${duplicateCodes.join("; ")}. Codes can be reused on different days, so check each date and time to confirm you want to keep every occurrence.`;
        warning.hidden = false;
      }

      if (window.location.protocol === 'file:') {
        document.getElementById('service-note').style.display = 'block';
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/\n/g, "&#10;");
      }

      function formatInEventTime(value, options = {}) {
        if (!value) return "TBA";
        const d = new Date(value);
        return new Intl.DateTimeFormat("en-US", {
          timeZone: EVENT_TIMEZONE,
          ...options
        }).format(d);
      }

      function formatTime(value) {
        return formatInEventTime(value, {
          hour: "numeric",
          minute: "2-digit"
        });
      }

      function formatClock(value) {
        if (!value) return "--:--";
        if (clockCache.has(value)) return clockCache.get(value);
        const parts = clockFormatter.formatToParts(new Date(value));
        const hour = parts.find((part) => part.type === "hour")?.value || "";
        const minute = parts.find((part) => part.type === "minute")?.value || "";
        const clock = `${hour}:${minute}`;
        clockCache.set(value, clock);
        return clock;
      }

      function formatDay(value) {
        if (!value) return "";
        return formatInEventTime(value, {
          weekday: "short",
          month: "short",
          day: "numeric"
        });
      }

      function dateKeyToDate(dateKey) {
        const [year, month, day] = dateKey.split("-").map(Number);
        return new Date(Date.UTC(year, month - 1, day, 20));
      }

      function formatDayKey(dateKey) {
        return new Intl.DateTimeFormat("en-US", {
          timeZone: EVENT_TIMEZONE,
          weekday: "short",
          month: "short",
          day: "numeric"
        }).format(dateKeyToDate(dateKey));
      }

      function formatDayLong(dateKey) {
        if (!dateKey) return "No date";
        const d = dateKeyToDate(dateKey);
        return new Intl.DateTimeFormat("en-US", {
          timeZone: EVENT_TIMEZONE,
          weekday: "long",
          month: "long",
          day: "numeric"
        }).format(d);
      }

      function formatDuration(start, end) {
        if (!start || !end) return "";
        const s = new Date(start);
        const e = new Date(end);
        const mins = Math.max(0, (e - s) / 60000);
        return `${Math.round(mins)} min`;
      }

      function formatDurationShort(start, end) {
        if (!start || !end) return "";
        const mins = Math.max(0, Math.round((new Date(end) - new Date(start)) / 60000));
        if (mins < 60) return `${mins}m`;
        const hours = Math.floor(mins / 60);
        const remainder = mins % 60;
        return remainder ? `${hours}h ${remainder}m` : `${hours}h`;
      }

      function getEventParts(dateString) {
        if (eventPartsCache.has(dateString)) return eventPartsCache.get(dateString);
        const parts = eventPartsFormatter.formatToParts(new Date(dateString));

        const values = {};
        for (const part of parts) {
          if (part.type !== "literal") values[part.type] = part.value;
        }

        const result = {
          year: values.year,
          month: values.month,
          day: values.day,
          hour: Number(values.hour || 0),
          minute: Number(values.minute || 0)
        };
        eventPartsCache.set(dateString, result);
        return result;
      }

      function getEventDateKey(dateString) {
        const { year, month, day } = getEventParts(dateString);
        return `${year}-${month}-${day}`;
      }

      function getMinutesFromDayStart(dateString) {
        const { hour, minute } = getEventParts(dateString);
        return hour * 60 + minute;
      }

      function getBroadLocation(locationValue) {
        const raw = (locationValue || 'Location TBD').trim();
        if (!raw || raw === 'Location TBD') return 'Location TBD';
        const broad = raw.split('|')[0].trim();
        return broad || raw;
      }

      function formatDayHeader(dateString) {
        const d = new Date(dateString);
        const parts = new Intl.DateTimeFormat("en-US", {
          timeZone: EVENT_TIMEZONE,
          weekday: "short",
          month: "short",
          day: "numeric"
        }).formatToParts(d);

        const day = parts.find((part) => part.type === "weekday")?.value || "";
        const month = parts.find((part) => part.type === "month")?.value || "";
        const date = parts.find((part) => part.type === "day")?.value || "";
        return `
          <div>
            <span>${day}</span>
            <strong>${month} ${date}</strong>
          </div>
        `;
      }

      function formatTimeLabel(minutes) {
        const hour = Math.floor(minutes / 60);
        const minute = minutes % 60;
        const label = new Date(Date.UTC(2020, 0, 1, hour, minute));
        return timeLabelFormatter.format(label);
      }

      function getScheduledDates(sessions) {
        return [...new Set(sessions
          .filter((session) => session.start)
          .map((session) => getEventDateKey(session.start))
          .filter(Boolean))]
          .sort();
      }

      function ensureSelectedDate(sessions) {
        const previousDate = state.selectedDate;
        const dates = getScheduledDates(sessions);
        if (!dates.length) {
          state.selectedDate = null;
          if (previousDate !== null) saveSelectedDate();
          return;
        }

        if (!state.selectedDate || !dates.includes(state.selectedDate)) {
          state.selectedDate = dates[0];
        }
        if (state.selectedDate !== previousDate) {
          saveSelectedDate();
        }
      }

      function updateDateSelector() {
        const selector = document.getElementById("date-selector");
        const dates = getScheduledDates(state.sessions);

        if (!dates.length) {
          selector.innerHTML = '<option value="">No dates</option>';
          selector.disabled = true;
          document.getElementById("prev-day").disabled = true;
          document.getElementById("next-day").disabled = true;
          return;
        }

        ensureSelectedDate(state.sessions);
        selector.disabled = false;
        selector.innerHTML = dates.map((date) => `<option value="${date}">${formatDayKey(date)}</option>`).join('');
        selector.value = state.selectedDate;
        const index = dates.indexOf(state.selectedDate);
        document.getElementById("prev-day").disabled = index <= 0;
        document.getElementById("next-day").disabled = index >= dates.length - 1;
      }

      function updateFilterControls() {
        const typeCount = document.querySelectorAll("#session-type-filter-options input:checked").length;
        const optionCount = ["session-level-filter", "recording-status-filter", "audience-type-filter"]
          .filter((id) => document.getElementById(id).value).length;
        const count = typeCount + optionCount;
        document.getElementById("filter-panel-label").textContent = count ? `Filters (${count})` : "Filters";
        document.getElementById("filter-panel").classList.toggle("has-filters", count > 0);
        document.getElementById("clear-filters").hidden =
          !count && !document.getElementById("search").value && !state.showSelectedOnly;
      }

      function matchesSearch(session, searchTerm) {
        if (!searchTerm) return true;
        let haystack = searchCache.get(session);
        if (!haystack) {
          haystack = [
            session.title || "",
            session.location || "",
            session.tags ? session.tags.join(" ") : "",
            session.metadata ? session.metadata.join(" ") : "",
            session.eyebrow || "",
            session.abstract || "",
            session.sessionType || "",
            session.speakerNames || ""
          ].join(" ").toLowerCase();
          searchCache.set(session, haystack);
        }
        return haystack.includes(searchTerm);
      }

      function getFilterValues(getValues) {
        return [...new Set(state.sessions
          .filter((session) => session.start && session.end)
          .flatMap(getValues)
          .map((value) => String(value || "").trim())
          .filter(Boolean))]
          .sort((a, b) => a.localeCompare(b));
      }

      function populateFilterOptions(selectId, defaultLabel, getValues) {
        const select = document.getElementById(selectId);
        select.replaceChildren(new Option(defaultLabel, ""));
        getFilterValues(getValues).forEach((value) => select.add(new Option(value, value)));
      }

      function updateSessionTypeFilterLabel() {
        const selectedCount = document.querySelectorAll("#session-type-filter-options input:checked").length;
        document.getElementById("session-type-filter-label").textContent = selectedCount
          ? `${selectedCount} session type${selectedCount === 1 ? "" : "s"} selected`
          : "All session types";
      }

      function populateSessionTypeFilter() {
        const options = document.getElementById("session-type-filter-options");
        const fragment = document.createDocumentFragment();
        for (const sessionType of getFilterValues((session) => [session.sessionType || ""])) {
          const label = document.createElement("label");
          label.className = "multi-select-option";
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.value = sessionType;
          const swatch = document.createElement("span");
          swatch.className = "session-type-swatch";
          swatch.style.setProperty("--session-type-color", getSessionTypeColor(sessionType));
          const text = document.createElement("span");
          text.textContent = sessionType;
          label.append(checkbox, swatch, text);
          fragment.append(label);
        }
        options.replaceChildren(fragment);
        updateSessionTypeFilterLabel();
      }

      function populateSessionFilters() {
        populateSessionTypeFilter();
        populateFilterOptions("session-level-filter", "All levels", (session) => session.sessionLevel || []);
        populateFilterOptions("recording-status-filter", "All recording statuses", (session) => session.viewingOptions || []);
        populateFilterOptions("audience-type-filter", "All audience types", (session) => session.audienceTypes || []);
      }

      function matchesOptionFilter(session, field, selectedValue) {
        if (!selectedValue) return true;
        const values = session[field];
        return Array.isArray(values) ? values.includes(selectedValue) : values === selectedValue;
      }

      function getFilteredSessions() {
        const searchTerm = document.getElementById("search").value.trim().toLowerCase();
        const selectedTypes = new Set([...document.querySelectorAll("#session-type-filter-options input:checked")]
          .map((input) => input.value));
        const selectedLevel = document.getElementById("session-level-filter").value;
        const selectedRecordingStatus = document.getElementById("recording-status-filter").value;
        const selectedAudienceType = document.getElementById("audience-type-filter").value;
        return state.sessions.filter((session) =>
          session.start && session.end &&
          (!state.showSelectedOnly || state.selectedSessions.has(getSessionKey(session))) &&
          (!selectedTypes.size || selectedTypes.has((session.sessionType || "").trim())) &&
          matchesOptionFilter(session, "sessionLevel", selectedLevel) &&
          matchesOptionFilter(session, "viewingOptions", selectedRecordingStatus) &&
          matchesOptionFilter(session, "audienceTypes", selectedAudienceType) &&
          matchesSearch(session, searchTerm)
        );
      }

      function getSessionUrl(session) {
        const routeId = session.sessionInstanceId || session.sessionCode;
        return routeId
          ? `https://ignite.microsoft.com/en-US/sessions/${encodeURIComponent(routeId)}`
          : session.url || "#";
      }

      function buildCalendarViewFor(scheduled) {
        const daySessions = scheduled
          .filter((session) => state.selectedDate ? getEventDateKey(session.start) === state.selectedDate : true)
          .sort((a, b) => new Date(a.start) - new Date(b.start));

        if (!daySessions.length) {
          return '<div class="empty">No sessions scheduled for the selected day.</div>';
        }

        const validMinutes = daySessions.flatMap((session) => {
          const effectiveEnd = session.end || session.start;
          return [getMinutesFromDayStart(session.start), getMinutesFromDayStart(effectiveEnd)];
        });

        const dayStart = Math.max(0, Math.floor(Math.min(...validMinutes) / 30) * 30 - 30);
        const dayEnd = Math.min(1440, Math.ceil(Math.max(...validMinutes) / 30) * 30 + 30);
        const slotSize = 30;
        const rowHeight = 54;
        const rowCount = Math.max(8, Math.ceil((dayEnd - dayStart) / slotSize));
        const bodyHeight = rowCount * rowHeight;

        const times = daySessions.map((session) => ({
          start: new Date(session.start).getTime(),
          end: new Date(session.end || session.start).getTime()
        }));
        const conflicts = new Set();
        for (let i = 0; i < daySessions.length; i += 1) {
          for (let j = i + 1; j < daySessions.length; j += 1) {
            if (times[j].start >= times[i].end) break;
            if (times[i].start < times[j].end) {
              conflicts.add(daySessions[i]);
              conflicts.add(daySessions[j]);
            }
          }
        }

        const groups = new Map();
        for (const session of daySessions) {
          const groupName = state.sortBy === "sessionType"
            ? (session.sessionType || session.eyebrow || "Session").trim()
            : getBroadLocation(session.location);
          if (!groups.has(groupName)) groups.set(groupName, []);
          groups.get(groupName).push(session);
        }

        const laneWidth = 170;
        const buildingPlans = [...groups.entries()]
          .sort((a, b) => {
            const priority = (name) => state.sortBy === "location" && name === "Chase Center" ? 0 : 1;
            return priority(a[0]) - priority(b[0]) || b[1].length - a[1].length || a[0].localeCompare(b[0]);
          })
          .map(([name, sessions]) => {
            const laneEnds = [];
            const laneMap = new Map();
            for (const session of sessions) {
              const start = new Date(session.start).getTime();
              const end = new Date(session.end || session.start).getTime();
              let lane = laneEnds.findIndex((laneEnd) => laneEnd <= start);
              if (lane === -1) {
                lane = laneEnds.length;
                laneEnds.push(end);
              } else {
                laneEnds[lane] = end;
              }
              laneMap.set(session, lane);
            }
            const laneCount = Math.max(1, laneEnds.length);
            return {
              name,
              sessions,
              laneMap,
              laneCount,
              width: Math.max(240, laneCount * laneWidth + 32)
            };
          });

        const totalWidth = 86 + buildingPlans.reduce((sum, plan) => sum + plan.width, 0);
        const gridColumns = `86px ${buildingPlans.map((plan) => `${plan.width}px`).join(' ')}`;

        const timeLabels = Array.from({ length: rowCount }, (_, index) => {
          const minutes = dayStart + index * slotSize;
          const sessionsInSlot = daySessions.filter((session) => {
            const start = getMinutesFromDayStart(session.start);
            const end = getMinutesFromDayStart(session.end || session.start);
            return start < minutes + slotSize && end > minutes;
          });
          const sessionCount = sessionsInSlot.length;
          const hasSelectedSession = sessionsInSlot.some((session) => state.selectedSessions.has(getSessionKey(session)));
          const countLabel = `${sessionCount} session${sessionCount === 1 ? '' : 's'}`;
          const selectedLabel = hasSelectedSession
            ? '<span class="time-selected-indicator" title="A session you selected is scheduled during this time">✓ selected</span>'
            : '';
          return `<div class="time-label${hasSelectedSession ? ' has-selected-session' : ''}"><span class="time-label-time">${formatTimeLabel(minutes)}</span><span class="time-session-count">${countLabel}</span>${selectedLabel}</div>`;
        }).join('');

        const headerColumns = buildingPlans.map((plan) => `
          <div class="day-header">
            <strong>${escapeHtml(plan.name)}</strong>
            <span class="building-count">${plan.sessions.length} session${plan.sessions.length === 1 ? '' : 's'}</span>
          </div>
        `).join('');

        const columns = buildingPlans.map((plan) => {
          const blocks = plan.sessions.map((session) => {
            const startMinutes = getMinutesFromDayStart(session.start);
            const endMinutes = getMinutesFromDayStart(session.end || session.start);
            const top = ((startMinutes - dayStart) / slotSize) * rowHeight;
            const height = Math.max(44, ((endMinutes - startMinutes) / slotSize) * rowHeight - 2);
            const lane = plan.laneMap.get(session) || 0;
            const left = 8 + lane * laneWidth;
            const width = plan.laneCount === 1 ? plan.width - 16 : laneWidth - 10;
            const hasConflict = conflicts.has(session);
            const sessionType = session.sessionType || session.eyebrow || 'Session';
            const sessionCode = session.sessionCode || '';
            const recordingStatus = (session.viewingOptions || []).find((option) =>
              option === 'Will be recorded' || option === 'Will not be recorded'
            );
            const recordingIcon = recordingStatus ? `
              <span class="event-recording${recordingStatus === 'Will not be recorded' ? ' not-recorded' : ''}" role="img" aria-label="${escapeAttr(recordingStatus)}" title="${escapeAttr(recordingStatus)}">
                <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                  <rect x="1.5" y="4" width="8.5" height="8" rx="1.5"></rect>
                  <path d="m10 6.5 4-2v7l-4-2"></path>
                  ${recordingStatus === 'Will not be recorded' ? '<path d="M2 14 14 2"></path>' : ''}
                </svg>
              </span>` : '';
            const sessionKey = getSessionKey(session);
            const isSelected = state.selectedSessions.has(sessionKey);
            const tooltip = session.title;
            return `
              <article class="event-block${hasConflict ? ' has-conflict' : ''}${height < 64 ? ' compact' : ''}${isSelected ? ' is-selected' : ''}" data-start="${new Date(session.start).getTime()}" data-end="${new Date(session.end || session.start).getTime()}" style="top:${top}px;height:${height}px;left:${left}px;width:${width}px;--title-lines:${Math.max(1, Math.floor((height - 42) / 15))};--session-type-color:${escapeAttr(getSessionTypeColor(sessionType))};" title="${escapeAttr(tooltip)}">
                <button class="event-select-button" type="button" data-session-key="${escapeAttr(sessionKey)}" aria-label="${isSelected ? 'Remove from' : 'Add to'} my sessions: ${escapeAttr(session.title)}" aria-pressed="${isSelected}" title="${isSelected ? 'Remove from' : 'Add to'} my sessions">${isSelected ? '✓' : '+'}</button>
                <div class="event-top">
                  <span class="event-time">${formatClock(session.start)}–${formatClock(session.end)}</span>
                  <span class="event-duration">${formatDurationShort(session.start, session.end)}</span>
                </div>
                <h4><a href="${escapeAttr(getSessionUrl(session))}" target="_blank" rel="noreferrer">${escapeHtml(session.title)}</a></h4>
                <div class="event-meta">
                  ${recordingIcon}
                  <span class="event-type"><span class="event-type-dot" aria-hidden="true"></span><span class="event-type-name">${escapeHtml(sessionType)}</span></span>
                  ${sessionCode ? `<span class="event-session-code">${escapeHtml(sessionCode)}</span>` : ''}
                </div>
              </article>
            `;
          }).join('');
          return `<div class="day-column" style="width:${plan.width}px;height:${bodyHeight}px;">${blocks}</div>`;
        }).join('');

        return `
          <div class="calendar-shell" role="region" aria-label="Session calendar" tabindex="0" style="--row-count:${rowCount};">
            <div class="calendar-header" style="width:${totalWidth}px;grid-template-columns:${gridColumns};">
              <div class="corner"><span class="corner-label" title="America/Los_Angeles">Pacific Time</span><span class="corner-label">${daySessions.length} session${daySessions.length === 1 ? '' : 's'}</span></div>
              ${headerColumns}
            </div>
            <div class="calendar-body" style="width:${totalWidth}px;height:${bodyHeight}px;grid-template-columns:${gridColumns};">
              <div class="time-gutter" style="height:${bodyHeight}px;">${timeLabels}</div>
              ${columns}
            </div>
          </div>
        `;
      }

      function renderPlanner() {
        const previousScroll = document.querySelector(".calendar-shell")?.scrollLeft || 0;
        updateSelectionFilter();
        updateSessionCodeWarning();
        updateFilterControls();
        const filtered = getFilteredSessions();
        state.filtered = filtered;

        updateDateSelector();

        positionFilterPanel();

        if (!filtered.length) {
          const emptyMessage = state.showSelectedOnly
            ? "No selected sessions match the current filters."
            : "No scheduled sessions match the current filter.";
          document.getElementById("agenda").innerHTML = `<div class="empty">${emptyMessage}</div>`;
          return;
        }

        const calendarHtml = buildCalendarViewFor(filtered);
        document.getElementById("agenda").innerHTML = `
          <div class="planner-layout">
            <div class="planner-main">${calendarHtml}</div>
          </div>
        `;
        const calendar = document.querySelector(".calendar-shell");
        if (calendar) calendar.scrollLeft = previousScroll;
      }

      function changeSelectedDate(delta) {
        const dates = getScheduledDates(state.sessions);
        if (!dates.length) return;

        ensureSelectedDate(state.sessions);
        const index = dates.indexOf(state.selectedDate);
        const nextIndex = Math.max(0, Math.min(dates.length - 1, index + delta));
        state.selectedDate = dates[nextIndex];
        renderPlanner();
      }

      function clearConflictHighlight() {
        document.querySelectorAll(".event-block.is-clash, .event-block.is-active, .event-block.is-dimmed").forEach((block) => {
          block.classList.remove("is-clash", "is-active", "is-dimmed");
        });
      }

      function highlightConflicts(block) {
        const start = Number(block.dataset.start);
        const end = Number(block.dataset.end);
        document.querySelectorAll(".event-block").forEach((candidate) => {
          const candidateStart = Number(candidate.dataset.start);
          const candidateEnd = Number(candidate.dataset.end);
          const overlaps = candidateStart < end && start < candidateEnd;
          candidate.classList.toggle("is-active", candidate === block);
          candidate.classList.toggle("is-clash", candidate !== block && overlaps);
          candidate.classList.toggle("is-dimmed", !overlaps);
        });
      }

      fetch('sessions.json')
        .then((response) => response.json())
        .then((sessions) => {
          state.sessions = sessions.filter((s) => s.title);
          populateSessionFilters();
          ensureSelectedDate(state.sessions);
          updateDateSelector();
          renderPlanner();
        })
        .catch((error) => {
          document.getElementById("agenda").innerHTML = `
            <div class="empty">
              Unable to load sessions.json. Open the page from a local server, e.g. http://localhost:8000/ignite_planner.html.
            </div>
          `;
          console.error(error);
        });

      document.getElementById("search").addEventListener("input", renderPlanner);
      document.getElementById("clear-filters").addEventListener("click", () => {
        document.getElementById("search").value = "";
        document.querySelectorAll("#session-type-filter-options input:checked").forEach((input) => { input.checked = false; });
        ["session-level-filter", "recording-status-filter", "audience-type-filter"]
          .forEach((id) => { document.getElementById(id).value = ""; });
        state.showSelectedOnly = false;
        updateSessionTypeFilterLabel();
        renderPlanner();
      });
      const filterPanel = document.getElementById("filter-panel");
      function positionFilterPanel() {
        if (!filterPanel.open) return;
        const trigger = filterPanel.querySelector("summary").getBoundingClientRect();
        const content = filterPanel.querySelector(".filter-panel-content");
        const width = content.offsetWidth;
        content.style.left = `${Math.max(10, Math.min(trigger.right - width, window.innerWidth - width - 10))}px`;
        content.style.top = `${trigger.bottom + 6}px`;
      }
      filterPanel.addEventListener("toggle", positionFilterPanel);
      document.querySelector(".topbar").addEventListener("scroll", positionFilterPanel);
      window.addEventListener("scroll", positionFilterPanel);
      window.addEventListener("resize", positionFilterPanel);
      document.addEventListener("click", (event) => {
        if (!filterPanel.contains(event.target)) {
          filterPanel.open = false;
          document.getElementById("session-type-filter").open = false;
        }
      });
      filterPanel.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        const types = document.getElementById("session-type-filter");
        if (types.open) {
          types.open = false;
          types.querySelector("summary").focus();
        } else {
          filterPanel.open = false;
          filterPanel.querySelector("summary").focus();
        }
        event.preventDefault();
      });
      document.getElementById("session-type-filter").addEventListener("change", () => {
        updateSessionTypeFilterLabel();
        renderPlanner();
      });
      ["session-level-filter", "recording-status-filter", "audience-type-filter"]
        .forEach((id) => document.getElementById(id).addEventListener("change", renderPlanner));
      document.getElementById("sort-by").addEventListener("change", (event) => {
        state.sortBy = event.target.value;
        renderPlanner();
      });

      document.getElementById("selection-filter").addEventListener("click", () => {
        state.showSelectedOnly = !state.showSelectedOnly;
        renderPlanner();
      });

      const agendaElement = document.getElementById("agenda");
      agendaElement.addEventListener("click", (event) => {
        const button = event.target.closest(".event-select-button");
        if (!button) return;
        event.preventDefault();
        event.stopPropagation();
        const key = button.dataset.sessionKey;
        if (state.selectedSessions.has(key)) {
          state.selectedSessions.delete(key);
        } else {
          state.selectedSessions.add(key);
        }
        saveSelectedSessions();
        renderPlanner();
      });
      agendaElement.addEventListener("mouseover", (event) => {
        const block = event.target.closest(".event-block");
        if (block) highlightConflicts(block);
      });
      agendaElement.addEventListener("mouseout", (event) => {
        const block = event.target.closest(".event-block");
        if (!block) return;
        if (event.relatedTarget && block.contains(event.relatedTarget)) return;
        clearConflictHighlight();
      });

      document.getElementById("date-selector").addEventListener("change", (event) => {
        state.selectedDate = event.target.value;
        renderPlanner();
      });
      document.getElementById("prev-day").addEventListener("click", () => changeSelectedDate(-1));
      document.getElementById("next-day").addEventListener("click", () => changeSelectedDate(1));
    </script>
  </body>
</html>

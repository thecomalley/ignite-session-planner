name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Configure Application Insights
        env:
          APPLICATION_INSIGHTS_CONNECTION_STRING: ${{ vars.APPLICATION_INSIGHTS_CONNECTION_STRING }}
        run: |
          if [ -z "$APPLICATION_INSIGHTS_CONNECTION_STRING" ]; then
            echo "Application Insights is not configured; deploying with telemetry disabled."
            exit 0
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("ignite_planner.html")
          html = path.read_text()
          placeholder = '"__APPLICATION_INSIGHTS_CONNECTION_STRING__"'
          if placeholder not in html:
              raise SystemExit("Application Insights connection string placeholder is missing.")
          connection_string = json.dumps(os.environ["APPLICATION_INSIGHTS_CONNECTION_STRING"])
          path.write_text(html.replace(placeholder, connection_string))
          PY
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_MEADOW_09287DB00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          skip_app_build: true # This repository is a plain static site; do not run Oryx
          api_location: "" # Api source code path - optional
          output_location: "" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_MEADOW_09287DB00 }}
          action: "close"
